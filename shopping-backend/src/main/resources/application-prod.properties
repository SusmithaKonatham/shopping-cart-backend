# Production Profile Configuration
spring.application.name=shopping-backend

# Database Configuration (use environment variables)
spring.datasource.url=jdbc:mysql://localhost:3306/shopping_backend?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Server Configuration
server.port=8080
server.servlet.context-path=/

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Logging Configuration
logging.level.root=WARN
logging.level.com.shopping.shoppingbackend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
